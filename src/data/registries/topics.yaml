- id: cashback
  name: 現金回饋
  order: 1
  description: 現金回饋信用卡怎麼選、回饋上限與通路條件整理，幫你找到日常消費回饋最高的卡。
  intro: |
    <p>現金回饋卡是最直覺的信用卡類型：刷多少、回多少，回饋直接折抵帳單或存入帳戶。但「最高 5%」這類廣告數字通常只限特定通路，而且每月有回饋上限。</p>
    <p>挑卡時先整理自己的消費分布，再比較每張卡在上限內的<strong>實拿回饋</strong>。這個主題從觀念、通路攻略到單卡評測，依序幫你建立判斷方式（範例導讀）。</p>
  featured: [how-to-choose-cashback-card, cashback-cap-explained, example-cashback-card-review]
  related: [no-annual-fee, online-shopping, mobile-pay]
  faq:
    - q: 現金回饋卡和點數卡哪個比較好？
      a: 現金回饋不用換算、不會過期，適合不想管點數的人；點數卡在特定兌換方式下價值較高，但需要花時間經營。
    - q: 現金回饋什麼時候會入帳？
      a: 多數銀行在次月或次期帳單折抵，部分數位銀行會即時回饋到帳戶，實際以各卡條款為準。
